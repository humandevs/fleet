# Fleet-instance inventory. One group for prod, one for the DR warm spare — SAME roles, different vars.
# Fill in the VM IPs (Hyper-V Default Switch usually hands out 172.x). ansible_user must have sudo.

[fleet_prod]
fleet-prod ansible_host=REPLACE_WITH_VM_IP

[fleet_dr]
# fleet-dr ansible_host=REPLACE_WITH_DR_VM_IP   # uncomment when the spare exists

[fleet:children]
fleet_prod
fleet_dr

[fleet:vars]
ansible_user=REPLACE_WITH_SSH_USER
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_python_interpreter=/usr/bin/python3
