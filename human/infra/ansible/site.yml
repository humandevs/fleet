---
# Provision a Fleet instance VM: base + toolchain, Redis, then build/run our fork against external MySQL.
# Same play for prod and the DR spare; group_vars differ (fleet_service_state / fleet_run_migrations).
- name: Provision Fleet instance
  hosts: fleet
  vars_files:
    - group_vars/vault.yml
  roles:
    - common   # base packages, firewalld, Docker, Go + Node toolchain, fork checkout
    - deps      # MySQL 8 + Redis via the repo's docker-compose (self-contained)
    - fleet     # build the fork, TLS, migrations, native systemd service
