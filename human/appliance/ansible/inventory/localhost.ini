# Local inventory for the APPLIANCE self-provision path: the box provisions itself on first boot by running
# site.yml against localhost (connection: local). group_vars/all.yml still applies (it targets `all`), and
# putting localhost in the `fleet` group satisfies site.yml's `hosts: fleet`.
[fleet_prod]
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3

[fleet:children]
fleet_prod
