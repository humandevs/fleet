# Non-secret config shared by all Fleet VMs. Secrets live in vault.yml (encrypted) — see README §Secrets.

# --- Versions (pin so prod and DR never drift) ---
go_version: "1.26.4"
node_version: "24"

# --- Our fork ---
# Source lives at fleet_src_dir. The appliance/Packer builds DELIVER it there (local FLEETSRC ISO extract,
# capturing uncommitted work — no repo network access). fleet_repo_url/branch are only used as a fallback:
# push mode (controller -> remote VM) clones them when source isn't pre-delivered. Leave the REPLACE_WITH
# placeholder to disable that fallback (local/appliance builds don't need it).
fleet_repo_url: "https://github.com/REPLACE_WITH_YOUR_FORK/fleet.git"
fleet_repo_branch: "human-dev"
fleet_src_dir: "/opt/fleet-src"      # single source location the roles build from
fleet_bin: "/usr/local/bin/fleet"    # installed binary
# The daemon runs as this dedicated non-login account. 'fleet' matches Fleet's own convention + a future
# Fleet container (so ownership lines up), and the MySQL DB user is also 'fleet' (separate namespace). It
# MUST differ from the admin LOGIN user (kickstart -AdminUser, default 'fleetadmin') -- reusing that name
# would set the login account's shell to /sbin/nologin and lock you out.
fleet_service_user: "fleet"

# --- MySQL + Redis via the repo's docker-compose (self-contained; the `deps` role runs them) ---
# Fleet is MySQL-only (8.0.36+, NOT MariaDB/Postgres). The compose `mysql` service publishes on
# 127.0.0.1:3306 with a persistent volume, and auto-creates db `fleet` + user `fleet`/`insecure` + root/toor
# — so these values are dictated by docker-compose.yml, not chosen here. To split the DB onto a separate box
# later: drop the `deps` role and point fleet_mysql_address at that host.
fleet_mysql_address: "127.0.0.1:3306"
fleet_mysql_database: "fleet"
fleet_mysql_username: "fleet"       # compose MYSQL_USER
fleet_mysql_password: "insecure"    # compose MYSQL_PASSWORD (dev cred, not secret — matches docker-compose.yml)
# The integration-test harness instead uses the compose `mysql_test` service (root/toor on 3307, its own
# throwaway DBs). root/toor is the same well-known value in Fleet's public docker-compose.yml.
mysql_root_password: "toor"

# --- Redis (runs locally on each VM; ephemeral, not source of truth) ---
fleet_redis_address: "127.0.0.1:6379"

# --- Server ---
fleet_server_address: "0.0.0.0:8080"
fleet_tls_dir: "/etc/fleet/tls"
fleet_config_dir: "/etc/fleet"

# --- DR flag: prod runs the service; the spare stays stopped until failover ---
fleet_service_state: "started"   # overridden to "stopped" in group_vars for fleet_dr (see README)
fleet_run_migrations: true       # only the active writer should run migrations
