---
# Base OS: packages, firewall, Docker Engine (for the stateful deps via the repo's compose), the Go + Node
# toolchain (to build our fork's binary), and the fork checkout.
# Written for Rocky/RHEL 9 (dnf). For Debian, swap the package tasks for apt equivalents.

- name: Install base packages
  ansible.builtin.dnf:
    name:
      - git
      - make
      - gcc
      - tar
      - openssl
      - firewalld
    state: present

# --- Docker Engine (runs MySQL + Redis via the repo's docker-compose.yml; native on Linux, no WSL2) ---
- name: Add Docker CE repo
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/centos/docker-ce.repo
    dest: /etc/yum.repos.d/docker-ce.repo
    mode: "0644"

- name: Install Docker Engine + compose plugin
  ansible.builtin.dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Enable firewalld
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
    state: started

- name: Open the Fleet server port
  ansible.posix.firewalld:
    port: 8080/tcp
    permanent: true
    immediate: true
    state: enabled

# --- Go toolchain (pinned) ---
- name: Check installed Go version
  ansible.builtin.command: /usr/local/go/bin/go version
  register: go_installed
  changed_when: false
  failed_when: false

- name: Install Go {{ go_version }}
  when: go_version not in (go_installed.stdout | default(''))
  block:
    - name: Download Go tarball
      ansible.builtin.get_url:
        url: "https://go.dev/dl/go{{ go_version }}.linux-amd64.tar.gz"
        dest: "/tmp/go{{ go_version }}.tar.gz"
        mode: "0644"
    - name: Remove any previous Go
      ansible.builtin.file:
        path: /usr/local/go
        state: absent
    - name: Extract Go to /usr/local
      ansible.builtin.unarchive:
        src: "/tmp/go{{ go_version }}.tar.gz"
        dest: /usr/local
        remote_src: true

- name: Put Go on PATH for all users
  ansible.builtin.copy:
    dest: /etc/profile.d/go.sh
    mode: "0644"
    content: "export PATH=$PATH:/usr/local/go/bin\n"

# --- Node (for building the frontend assets) ---
- name: Add NodeSource repo
  ansible.builtin.shell: |
    curl -fsSL https://rpm.nodesource.com/setup_{{ node_version }}.x | bash -
  args:
    creates: /etc/yum.repos.d/nodesource-nodejs.repo

- name: Install Node.js
  ansible.builtin.dnf:
    name: nodejs
    state: present

- name: Enable corepack (yarn)
  ansible.builtin.command: corepack enable
  changed_when: false

# Fleet source at {{ fleet_src_dir }}. Appliance/Packer deliver it out-of-band (FLEETSRC ISO extract or a
# provision step), so it's usually already present. Push mode (controller -> remote VM) has no such delivery,
# so we clone from fleet_repo_url when it's absent and a real URL is configured.
- name: Check whether Fleet source is already present
  ansible.builtin.stat:
    path: "{{ fleet_src_dir }}/go.mod"
  register: fleet_src_gomod

- name: Clone the fork (push/remote mode only — when source not pre-delivered)
  ansible.builtin.git:
    repo: "{{ fleet_repo_url }}"
    dest: "{{ fleet_src_dir }}"
    version: "{{ fleet_repo_branch }}"
  when:
    - not fleet_src_gomod.stat.exists
    - (fleet_repo_url | default('')) is match('^https?://')
    - "'REPLACE_WITH' not in (fleet_repo_url | default(''))"

- name: Assert Fleet source is present
  ansible.builtin.stat:
    path: "{{ fleet_src_dir }}/go.mod"
  register: fleet_src_final
  failed_when: not fleet_src_final.stat.exists
