[defaults]
inventory = inventory/hosts.ini
host_key_checking = False
retry_files_enabled = False
# No stdout_callback override: "yaml" needs community.general, which requirements.yml does not
# install. (This only ever worked by accident: the extracted tree was world-writable, so ansible
# ignored this cfg entirely.)
roles_path = roles

[privilege_escalation]
become = True
become_method = sudo
