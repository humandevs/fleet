[defaults]
inventory = inventory/hosts.ini
retry_files_enabled = False
# No stdout_callback override: "yaml" needs community.general, which requirements.yml does not
# install. (This only ever worked by accident: the extracted tree was world-writable, so ansible
# ignored this cfg entirely.)
roles_path = roles

[privilege_escalation]
become = True
become_method = sudo

[ssh_connection]
# accept-new (not disabled): trust-on-first-use for a new host, but a CHANGED key aborts — closes the
# push-mode MITM window where a spoofer could receive the rendered fleet.env + sudo execution. The
# localhost self-provision path uses connection=local, so this only affects controller->remote-VM runs.
ssh_args = -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=60s
