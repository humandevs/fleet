# Bake-time kickstart for the Packer golden image. Minimal: creates the `packer` build user (sudo NOPASSWD,
# password auth for Packer's SSH) and base packages. Provisioning + generalization happen via Packer
# provisioners, NOT a first-boot service (that's the difference from the one-off appliance kickstart).

text
lang en_US.UTF-8
keyboard us
timezone Etc/UTC --utc
network --bootproto=dhcp --device=link --activate --hostname=fleet-golden

zerombr
clearpart --all --initlabel
autopart --type=lvm
bootloader --location=mbr

rootpw --lock
selinux --enforcing
firewall --enabled --service=ssh
# Packer connects as this user; it's removed by generalize.sh so it never ships in the image.
user --name=packer --groups=wheel --plaintext --password=packer
services --enabled=sshd

reboot --eject

%packages
@^minimal-environment
openssh-server
git
%end

%post
echo "packer ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/90-packer
chmod 0440 /etc/sudoers.d/90-packer
%end
